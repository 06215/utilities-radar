<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Utilities Daily News Radar</title>
<style>
:root{--bg:#0b0d10;--card:#14181d;--bd:#232a33;--tx:#d7dde5;--mut:#7d8896;--g:#3ddc84;--c:#38bdf8;--r:#ff5c5c;--y:#f5c542}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:env(safe-area-inset-top) 10px 40px}
h1{font-size:15px;color:var(--g);margin:12px 0 2px}h2{font-size:12px;letter-spacing:.08em;color:var(--c);margin:18px 0 8px;text-transform:uppercase}
.sub{color:var(--mut);font-size:11px}.bar{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 11px;border-radius:16px;font:inherit;font-size:12px}
.chip.on{border-color:var(--g);color:var(--g)}select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:9px;border-radius:8px;font:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0}
.card.alta{border-left-color:var(--r)}.card.media{border-left-color:var(--y)}.card.baixa{border-left-color:var(--g)}
.t{font-weight:700;font-size:14px}.m{color:var(--mut);font-size:11px;margin:4px 0}.k{color:var(--c);font-size:11px;margin-top:6px}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:4px;padding:0 5px;margin:0 4px 2px 0;font-size:11px}
a{color:var(--c)}details>summary{cursor:pointer;color:var(--mut);padding:8px 0}.pw{color:var(--y);font-size:11px}
.co{margin:6px 0}.co b{color:var(--g)}.co div{font-size:12px;margin-left:10px}
</style></head><body>
<h1>▮ UTILITIES DAILY NEWS RADAR</h1><div class="sub" id="ts">carregando…</div>
<div class="bar" id="f"></div><select id="emp"><option value="">Todas as empresas</option></select>
<div id="app"></div>
<script>
const FILT=[["Todos",e=>1],["Energia",e=>e.setores.includes("Energia")],["Saneamento",e=>e.setores.includes("Saneamento")],
["Petróleo & Gás",e=>e.setores.includes("Petróleo & Gás")],["Regulação",e=>e.categorias.includes("Regulação")],
["M&A",e=>e.categorias.includes("M&A")],["Corporativo",e=>e.categorias.some(c=>["Resultados","Capex","Dívida/Rating","Dividendos","Governança","M&A"].includes(c))],
["Commodities",e=>e.categorias.includes("Commodities")],["Alta",e=>e.relevancia=="alta"],["Média",e=>e.relevancia=="media"]];
let D,fi=0;const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const RL={alta:"🔴 Alta",media:"🟡 Média",baixa:"🟢 Baixa"};
const safe=u=>/^https?:\/\//.test(u)?u:"#";
function link(p,s){const a=el("a",0,s.nome);a.href=safe(s.link);a.target="_blank";a.rel="noopener";p.append(a," ")}
function card(e){const c=el("div","card "+e.relevancia);c.append(el("div","t",e.titulo));
 const d=e.data?new Date(e.data).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"data não identificada";
 c.append(el("div","m",`${RL[e.relevancia]} · ${d} · Impacto: ${e.impacto}`));
 const tg=el("div");[...e.categorias,...e.setores].forEach(x=>tg.append(el("span","tag",x)));c.append(tg);
 const ln=(k,v)=>{const x=el("div","k",k);c.append(x,el("div",0,v))};
 ln("Empresas",(e.empresas.join(", ")||"Não identificado na fonte")+(e.tickers.length?" ("+e.tickers.join(", ")+")":""));
 ln("Resumo",e.resumo);ln("Por que importa (automático)",e.por_que);
 const f=el("div","k","Fontes");c.append(f);const fs=el("div");e.fontes.forEach(s=>link(fs,s));c.append(fs);
 if(e.fonte_primaria){const p=el("div","k","Fonte primária: ");link(p,e.fonte_primaria);c.append(p)}
 if(e.paywall)c.append(el("div","pw","Conteúdo completo pode estar indisponível devido a paywall."));return c}
function render(){const ef=$("emp").value,fn=FILT[fi][1],A=$("app");A.replaceChildren();
 const ok=e=>fn(e)&&(!ef||e.empresas.includes(ef));
 const main=D.eventos.filter(e=>e.relevancia!="baixa"&&ok(e)),low=D.eventos.filter(e=>e.relevancia=="baixa"&&ok(e));
 if(fi==0&&!ef){A.append(el("h2",0,"O que mudou hoje"));const t=D.o_que_mudou.map(i=>D.eventos[i]);
  t.length?t.forEach(e=>A.append(card(e))):A.append(el("div","sub","Sem eventos de alta/média relevância."));
  A.append(el("h2",0,"Empresas no radar"));const by={};main.forEach(e=>e.empresas.forEach(n=>(by[n]=by[n]||[]).push(e)));
  Object.keys(by).sort().forEach(n=>{const b=el("div","co");b.append(el("b",0,n));by[n].forEach(e=>b.append(el("div",0,"• "+e.titulo)));A.append(b)});
  A.append(el("h2",0,"Todas · alta e média"))}
 main.forEach(e=>A.append(card(e)));if(!main.length)A.append(el("div","sub","Nada nesse filtro."));
 const dt=el("details");dt.append(el("summary",0,`Monitoramento (${low.length})`));low.forEach(e=>dt.append(card(e)));A.append(dt);
 const er=D.coleta.filter(r=>r.erro);const s=el("details");s.append(el("summary",0,`Status da coleta: ${D.coleta.length-er.length}/${D.coleta.length} consultas ok`));
 er.forEach(r=>s.append(el("div","sub",`${r.consulta}: ${r.erro}`)));A.append(s)}
FILT.forEach(([n],i)=>{const b=el("button","chip"+(i?"":" on"),n);b.onclick=()=>{fi=i;document.querySelectorAll(".chip").forEach((x,j)=>x.classList.toggle("on",j==i));render()};$("f").append(b)});
$("emp").onchange=render;
fetch("data/news.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;
 $("ts").textContent="Atualizado em "+new Date(d.gerado_em).toLocaleString("pt-BR")+" · janela ~24-36h";
 d.empresas.forEach(c=>{const o=el("option",0,c.nome);o.value=c.nome;$("emp").append(o)});render()})
 .catch(()=>{$("ts").textContent="Ainda sem dados. Rode o workflow (veja o README)."});
</script></body></html>
