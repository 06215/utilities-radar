<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10"><title>Radar de Utilities</title>
<style>
:root{--bg:#0a0c10;--sf:#12161c;--sf2:#181e26;--ln:#222a35;--tx:#eef2f7;--mu:#8b97a8;--ac:#4ade80;--alta:#ff6b6b;--media:#f5b942;--baixa:#64748b;--pos:#4ade80;--neg:#ff6b6b;--inc:#8b97a8}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:max(env(safe-area-inset-top),14px) 14px 48px;max-width:640px;margin-inline:auto}
header{margin:6px 0 14px}h1{font-size:22px;margin:0;letter-spacing:-.02em}.sub{color:var(--mu);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}.st b{display:block;font-size:24px;line-height:1.1}.st span{font-size:12px;color:var(--mu)}
.bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 85%,transparent);z-index:3;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:#04210f;border-color:var(--ac);font-weight:600}
select{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--ln);padding:11px 12px;border-radius:12px;font:inherit;font-size:14px;margin-bottom:6px}
h2{font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:24px 2px 10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--baixa)}.card.alta::before{background:var(--alta)}.card.media::before{background:var(--media)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.pill{font-weight:700;padding:2px 9px;border-radius:999px;font-size:11px;color:#111}.pill.alta{background:var(--alta)}.pill.media{background:var(--media)}.pill.baixa{background:var(--baixa);color:#fff}
.imp.pos{color:var(--pos)}.imp.neg{color:var(--neg)}.imp.inc{color:var(--inc)}
.t{font-size:16px;font-weight:650;line-height:1.35;margin:8px 0 4px;letter-spacing:-.01em}
.sm{color:var(--mu);font-size:14px;margin:0 0 8px}.sm.vz{font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tag{font-size:12px;padding:3px 9px;border-radius:8px;background:var(--sf2);border:1px solid var(--ln)}.tag.co{color:var(--ac);border-color:#1d4d33}
details.mais>summary{cursor:pointer;color:var(--ac);font-size:13px;padding:8px 0 2px;list-style:none}details.mais>summary::-webkit-details-marker{display:none}
.bx{background:var(--sf2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}.bx b{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-bottom:2px}
a{color:#7dd3fc}.src a{display:inline-block;margin:2px 10px 2px 0}.pw{color:var(--media);font-size:12px;margin-top:6px}
details.gr{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:8px 0;padding:0 14px}details.gr>summary{padding:12px 0;cursor:pointer;display:flex;justify-content:space-between}
details.gr p{margin:0 0 10px;font-size:14px}.n{color:var(--mu)}
.vazio{color:var(--mu);text-align:center;padding:28px 10px}.ft{color:var(--mu);font-size:12px;margin-top:26px}
</style></head><body>
<header><h1>Radar de Utilities</h1><div class="sub" id="ts">Carregando…</div></header>
<div class="stats" id="st"></div>
<div class="bar" id="f"></div><select id="emp"><option value="">Todas as empresas</option></select>
<main id="app"></main><div class="ft" id="ft"></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const REL={alta:"Alta",media:"Média",baixa:"Monitorar"};
const IMP={Positivo:["▲ Positivo","pos"],Negativo:["▼ Negativo","neg"],Incerto:["● Incerto","inc"]};
const has=(e,c)=>e.categorias.includes(c);
const FIL=[["Todos",e=>1],["Alta",e=>e.relevancia=="alta"],["Energia",e=>e.setores.includes("Energia")],["Saneamento",e=>e.setores.includes("Saneamento")],["Regulação",e=>has(e,"Regulação")],["Tarifas",e=>has(e,"Tarifas")],["M&A",e=>has(e,"M&A")],["Resultados",e=>has(e,"Resultados")]];
let D,fi=0;
const hm=d=>d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function quando(iso){if(!iso)return"sem data";const d=new Date(iso),n=new Date(),o=new Date(n);o.setDate(n.getDate()-1);
 const dia=d.toDateString()==n.toDateString()?"Hoje":d.toDateString()==o.toDateString()?"Ontem":d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});return dia+" · "+hm(d)}
function lk(p,s){const a=h("a",0,s.nome);a.href=/^https?:\/\//.test(s.link)?s.link:"#";a.target="_blank";a.rel="noopener";p.append(a)}
function card(e){const c=h("article","card "+e.relevancia),top=h("div","top");
 top.append(h("span","pill "+e.relevancia,REL[e.relevancia]),h("span",0,quando(e.data)));
 const im=IMP[e.impacto]||IMP.Incerto;top.append(h("span","imp "+im[1],im[0]));c.append(top,h("div","t",e.titulo));
 const vz=e.resumo.startsWith("Não identificado");c.append(h("p","sm"+(vz?" vz":""),vz?"Só a manchete está disponível. Abra a fonte para ler.":e.resumo));
 const tg=h("div","tags");e.empresas.forEach(n=>tg.append(h("span","tag co",n)));e.categorias.slice(0,3).forEach(n=>tg.append(h("span","tag",n)));c.append(tg);
 const d=h("details","mais");d.append(h("summary",0,"Por que importa e fontes"));
 const b1=h("div","bx");b1.append(h("b",0,"POR QUE IMPORTA (resumo automático)"),h("span",0,e.por_que));
 const b2=h("div","bx src");b2.append(h("b",0,"FONTES"));
 if(e.fonte_primaria){const p=h("div");p.append(h("span","n","Fonte primária: "));lk(p,e.fonte_primaria);b2.append(p)}
 const fs=h("div");e.fontes.forEach(s=>lk(fs,s));b2.append(fs);
 if(e.tickers.length)b1.append(h("div","n","Tickers: "+e.tickers.join(", ")));
 if(e.paywall)b2.append(h("div","pw","Alguma fonte pode ter paywall; o conteúdo completo pode estar indisponível."));
 d.append(b1,b2);c.append(d);return c}
function sec(t,L,A){if(!L.length)return;A.append(h("h2",0,t));L.forEach(e=>A.append(card(e)))}
function render(){const A=$("#app");A.replaceChildren();const emp=$("#emp").value,f=FIL[fi][1];
 const ok=e=>f(e)&&(!emp||e.empresas.includes(emp));
 const vis=D.eventos.filter(e=>e.relevancia!="baixa"&&ok(e)),low=D.eventos.filter(e=>e.relevancia=="baixa"&&ok(e));
 if(!D.eventos.length)A.append(h("div","vazio","Nenhuma notícia relevante de Utilities nas últimas 24–36 horas."));
 else if(fi||emp){sec("Notícias",vis,A);if(!vis.length)A.append(h("div","vazio","Nada neste filtro."))}
 else{const H=new Set(D.o_que_mudou.map(i=>D.eventos[i]));
  sec("Destaques de hoje",D.o_que_mudou.map(i=>D.eventos[i]),A);
  const by={};vis.forEach(e=>e.empresas.forEach(n=>(by[n]=by[n]||[]).push(e)));const ns=Object.keys(by).sort();
  if(ns.length){A.append(h("h2",0,"Por empresa"));ns.forEach(n=>{const g=h("details","gr"),s=h("summary");s.append(h("span",0,n),h("span","n",by[n].length+" notícia(s)"));g.append(s);by[n].forEach(e=>g.append(h("p",0,"• "+e.titulo)));A.append(g)})}
  sec("Outras notícias",vis.filter(e=>!H.has(e)),A)}
 if(low.length){const g=h("details","gr"),s=h("summary");s.append(h("span",0,"Monitoramento"),h("span","n",low.length));g.append(s);low.forEach(e=>g.append(h("p",0,"• "+e.titulo)));A.append(g)}}
FIL.forEach(([n],i)=>{const b=h("button","chip"+(i?"":" on"),n);b.onclick=()=>{fi=i;document.querySelectorAll(".chip").forEach((x,j)=>x.classList.toggle("on",j==i));render()};$("#f").append(b)});
$("#emp").onchange=()=>render();
fetch("data/news.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;
 $("#ts").textContent="Atualizado "+quando(d.gerado_em).toLowerCase();
 const a=d.eventos.filter(e=>e.relevancia=="alta").length,m=d.eventos.filter(e=>e.relevancia=="media").length,c=new Set(d.eventos.flatMap(e=>e.empresas)).size;
 [[a,"Alta"],[m,"Média"],[c,"Empresas"]].forEach(([v,l])=>{const t=h("div","st");t.append(h("b",0,String(v)),h("span",0,l));$("#st").append(t)});
 d.empresas.forEach(x=>{const o=h("option",0,x.nome);o.value=x.nome;$("#emp").append(o)});
 const er=d.coleta.filter(r=>r.erro).length;$("#ft").textContent=`Fontes consultadas: ${d.coleta.length-er} de ${d.coleta.length} responderam. Classificação automática por palavras-chave; confirme na fonte.`;
 render()}).catch(()=>{$("#ts").textContent="Ainda sem dados. Rode o workflow no GitHub."});
</script></body></html>
